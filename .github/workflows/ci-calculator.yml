# Workflow for the Lab 5 calculator CI pipeline.
name: Calculator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Compile Java source files
        working-directory: backend
        run: mvn -B clean compile

      - name: Run all JUnit 5 test cases
        working-directory: backend
        run: mvn -B test

      - name: Build backend Docker image
        run: docker build --tag calculator-backend:ci ./backend

  compose-build:
    name: Docker Compose build validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build all Compose services
        run: docker compose build
